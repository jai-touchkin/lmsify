services:
  web:
    build: ./client
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped

  api:
    build: ./server
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/lmsify
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mongo_data:
  caddy_data: